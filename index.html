<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e7">
<title>Калькулятор совместимости</title>
<style>
  :root {
    --bg-1: #ffe4ee; --bg-2: #ffd6e7; --bg-3: #ffc9de;
    --card-bg: rgba(255,255,255,0.82);
    --card-border: rgba(255,255,255,0.9);
    --text-main: #7a3a56; --text-sub: #b56b8f; --accent: #d6337c;
    --input-bg: #ffffff; --input-border: #ffd0e0; --input-focus: #ff9ec4;
    --bar-bg: #ffe0ec; --heart-bg: #ff8fb8;
    --timer-cell-bg-1: #ffffff; --timer-cell-bg-2: #ffeef5;
    --timer-cell-border: #ffd0e0; --timer-num: #e0417f;
    --dashed: #ffd0e0;
    --shadow: 0 20px 50px rgba(255, 120, 170, .35), 0 4px 12px rgba(255, 120, 170, .15);
    --compliment-bg-1: rgba(255, 214, 231, 0.7);
    --compliment-bg-2: rgba(255, 200, 222, 0.7);
    --hate-bg: rgba(255, 240, 240, 0.85);
    --hate-border: rgba(180, 30, 60, 0.35);
  }
  [data-theme="dark"] {
    --bg-1: #2a0f1d; --bg-2: #3d1529; --bg-3: #4d1a33;
    --card-bg: rgba(60, 24, 42, 0.72);
    --card-border: rgba(255, 158, 196, 0.15);
    --text-main: #ffd0e0; --text-sub: #e3a7bf; --accent: #ff7eb0;
    --input-bg: rgba(255,255,255,0.07);
    --input-border: rgba(255, 158, 196, 0.3); --input-focus: #ff7eb0;
    --bar-bg: rgba(255, 208, 224, 0.15); --heart-bg: #ff6fa8;
    --timer-cell-bg-1: rgba(80, 30, 55, 0.6);
    --timer-cell-bg-2: rgba(100, 35, 65, 0.6);
    --timer-cell-border: rgba(255, 158, 196, 0.2);
    --timer-num: #ff8fc0; --dashed: rgba(255, 158, 196, 0.3);
    --shadow: 0 20px 50px rgba(0, 0, 0, .5), 0 4px 12px rgba(0, 0, 0, .3);
    --compliment-bg-1: rgba(100, 35, 65, 0.5);
    --compliment-bg-2: rgba(120, 40, 75, 0.5);
    --hate-bg: rgba(60, 10, 20, 0.55);
    --hate-border: rgba(255, 60, 90, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 40%, var(--bg-3) 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    overflow-x: hidden;
    position: relative;
    transition: background .5s;
  }

  #themeToggle {
    position: fixed;
    top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right));
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 1.3rem; cursor: pointer; z-index: 100;
    transition: transform .3s;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(255, 120, 170, .25);
    touch-action: manipulation;
  }
  #themeToggle:hover { transform: scale(1.1) rotate(15deg); }
  #themeToggle:active { transform: scale(.95); }

  #hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

  .heart {
    position: absolute;
    bottom: -60px;
    color: var(--heart-bg);
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0;
    user-select: none;
    pointer-events: auto;
    cursor: pointer;
    transition: color .5s;
    transform-origin: center;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
    10%  { opacity: .9; }
    90%  { opacity: .5; }
    100% { transform: translateY(-115vh) rotate(40deg) scale(1.2); opacity: 0; }
  }

  /* Лопание сердечка */
  .heart.popping {
    animation: popHeart .45s cubic-bezier(.2, .8, .4, 1) forwards !important;
    pointer-events: none;
  }
  @keyframes popHeart {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    45%  { transform: scale(1.7) rotate(8deg); opacity: 1; }
    100% { transform: scale(.15) rotate(-15deg); opacity: 0; }
  }

  /* Мини-брызги при лопании */
  .mini-burst {
    position: fixed;
    pointer-events: none;
    font-size: 14px;
    z-index: 200;
    transform: translate(-50%, -50%);
    animation: miniBurst .6s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes miniBurst {
    0%   { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--mx)), calc(-50% + var(--my))) scale(.2); opacity: 0; }
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px;
    background: var(--card-bg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 28px; padding: 36px 28px 32px;
    box-shadow: var(--shadow);
    border: 1px solid var(--card-border);
    text-align: center;
    transition: background .5s, border-color .5s;
  }

  h1 { font-size: 1.7rem; color: var(--accent); margin-bottom: 6px; letter-spacing: .5px; transition: color .5s; }
  .subtitle { color: var(--text-sub); font-size: .9rem; margin-bottom: 24px; transition: color .5s; }

  input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    font-size: 16px;
    font-family: inherit;
    color: var(--text-main);
    outline: none;
    transition: border-color .25s, box-shadow .25s;
    margin-bottom: 12px;
    text-align: center;
  }
  input::placeholder { color: var(--text-sub); opacity: .6; }
  input:focus { border-color: var(--input-focus); box-shadow: 0 0 0 4px rgba(255, 158, 196, .25); }

  button.main-btn {
    width: 100%;
    padding: 15px;
    margin-top: 6px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #ff9ec4, #ff6fa8);
    color: #fff; font-size: 1.05rem; font-weight: 600; font-family: inherit;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 8px 20px rgba(255, 111, 168, .45);
    touch-action: manipulation;
  }
  button.main-btn:hover  { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(255, 111, 168, .55); }
  button.main-btn:active { transform: translateY(0) scale(.98); }

  #result { margin-top: 24px; overflow: hidden; }

  .label-badge {
    display: inline-block; padding: 6px 18px;
    background: linear-gradient(135deg, #ff9ec4, #ff6fa8);
    color: #fff; border-radius: 20px;
    font-size: .82rem; font-weight: 600; letter-spacing: .4px;
    margin-bottom: 14px;
    box-shadow: 0 4px 12px rgba(255, 111, 168, .35);
    animation: badgeIn .5s ease;
  }
  .hate-badge {
    background: linear-gradient(135deg, #b91c3c, #6b0018);
    box-shadow: 0 4px 12px rgba(185, 28, 60, .4);
  }
  @keyframes badgeIn {
    from { opacity: 0; transform: scale(.8); }
    to   { opacity: 1; transform: scale(1); }
  }

  .percent {
    font-size: 3.4rem; font-weight: 800;
    background: linear-gradient(135deg, #ff5c9d, #d6337c);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; line-height: 1.1;
    font-variant-numeric: tabular-nums; transition: background .5s;
  }
  .percent-label { color: var(--text-sub); font-size: .95rem; margin-bottom: 8px; transition: color .5s; }
  .bar {
    height: 12px; background: var(--bar-bg);
    border-radius: 10px; overflow: hidden;
    margin: 14px 0 4px; transition: background .5s;
  }
  .bar-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #ffa8cb, #ff5c9d);
    border-radius: 10px;
    transition: width 1.2s cubic-bezier(.22, 1, .36, 1), background .5s;
  }
  .verdict { color: var(--text-sub); font-size: .95rem; margin-top: 8px; transition: color .5s; }

  .hate-block {
    background: linear-gradient(160deg, var(--hate-bg), rgba(120, 0, 30, 0.08));
    border: 1.5px solid var(--hate-border);
    border-radius: 20px;
    padding: 22px 18px 18px;
    animation: hateIn .7s ease;
    box-shadow: 0 8px 22px rgba(120, 0, 30, .2);
    position: relative;
  }
  @keyframes hateIn {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  .hate-title {
    font-size: .85rem; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: #b91c3c;
    margin-bottom: 14px; transition: color .5s;
  }
  [data-theme="dark"] .hate-title { color: #ff5b7f; }

  .compliment-box {
    margin: 20px 0 4px;
    padding: 20px 22px 18px;
    background: linear-gradient(135deg, var(--compliment-bg-1), var(--compliment-bg-2));
    border: 1.5px solid rgba(255, 158, 196, 0.6);
    border-radius: 18px;
    color: var(--accent);
    font-size: .98rem; font-style: italic; line-height: 1.55;
    position: relative; text-align: center;
    animation: hateIn .7s ease;
    box-shadow: 0 4px 14px rgba(255, 150, 190, .2);
  }
  .compliment-box .tag {
    display: block; font-style: normal; font-weight: 700;
    font-size: .78rem; letter-spacing: .6px; text-transform: uppercase;
    color: var(--text-sub); margin-bottom: 8px;
  }
  .compliment-box .heart-top {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    font-size: 1.6rem; background: var(--card-bg);
    padding: 2px 10px; border-radius: 50%; line-height: 1;
  }

  .share-btn {
    margin-top: 16px; padding: 11px 20px;
    border: 2px solid var(--input-border);
    background: transparent; color: var(--accent);
    border-radius: 12px; font-size: .92rem; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background .25s, color .25s, border-color .25s;
    touch-action: manipulation;
  }
  .share-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .share-btn:active { transform: scale(.97); }

  #timer {
    margin-top: 26px; padding-top: 22px;
    border-top: 2px dashed var(--dashed);
    opacity: 0; max-height: 0; overflow: hidden;
    transition: opacity .5s ease, max-height .8s ease, padding-top .5s, margin-top .5s, border-color .5s;
  }
  #timer.show { opacity: 1; max-height: 1400px; }
  .timer-section { margin-bottom: 22px; }
  .timer-section:last-child { margin-bottom: 0; }
  #timer h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 4px; transition: color .5s; }
  #timer .since { font-size: .8rem; color: var(--text-sub); margin-bottom: 14px; transition: color .5s; }
  .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .timer-cell {
    background: linear-gradient(160deg, var(--timer-cell-bg-1), var(--timer-cell-bg-2));
    border: 1px solid var(--timer-cell-border);
    border-radius: 16px; padding: 14px 4px 10px;
    box-shadow: 0 4px 10px rgba(255, 150, 190, .18);
    transition: background .5s, border-color .5s;
  }
  .timer-cell .num {
    display: block; font-size: 1.5rem; font-weight: 800;
    color: var(--timer-num); font-variant-numeric: tabular-nums;
    transition: color .5s;
  }
  .timer-cell .unit {
    display: block; font-size: .72rem; color: var(--text-sub);
    margin-top: 4px; text-transform: uppercase; letter-spacing: .5px;
    transition: color .5s;
  }

  .burst-heart {
    position: absolute; pointer-events: none; z-index: 100;
    animation: burst 1.3s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(.3) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  /* ====== МОБИЛЬНАЯ ОПТИМИЗАЦИЯ ====== */
  @media (max-width: 480px) {
    body { padding: 12px; }

    .container {
      padding: 26px 18px 22px;
      border-radius: 22px;
    }
    h1 { font-size: 1.35rem; }
    .subtitle { font-size: .82rem; margin-bottom: 18px; }

    input {
      padding: 14px 14px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button.main-btn {
      padding: 15px;
      font-size: 1rem;
    }

    .percent { font-size: 2.6rem; }
    .percent-label { font-size: .88rem; }
    .verdict { font-size: .88rem; }

    .timer-grid { gap: 6px; }
    .timer-cell { padding: 10px 2px 8px; border-radius: 12px; }
    .timer-cell .num { font-size: 1.05rem; }
    .timer-cell .unit { font-size: .62rem; margin-top: 3px; }
    #timer h2 { font-size: 1rem; }
    #timer .since { font-size: .74rem; margin-bottom: 10px; }

    .compliment-box { font-size: .88rem; padding: 16px 14px 12px; }
    .compliment-box .heart-top { font-size: 1.3rem; }
    .compliment-box .tag { font-size: .72rem; }

    .hate-block { padding: 18px 14px 14px; border-radius: 16px; }
    .hate-title { font-size: .78rem; letter-spacing: 1px; }

    .label-badge { font-size: .75rem; padding: 5px 14px; margin-bottom: 10px; }
    .share-btn { font-size: .85rem; padding: 11px 16px; margin-top: 14px; }
    #themeToggle {
      width: 44px; height: 44px; font-size: 1.15rem;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
    }
  }

  @media (max-width: 360px) {
    .timer-grid { gap: 4px; }
    .timer-cell { padding: 8px 1px 6px; border-radius: 10px; }
    .timer-cell .num { font-size: .92rem; }
    .timer-cell .unit { font-size: .55rem; letter-spacing: .2px; }
    .percent { font-size: 2.2rem; }
    h1 { font-size: 1.2rem; }
    .container { padding: 22px 14px 20px; }
  }

  /* Отключаем анимации для тех, кто просит */
  @media (prefers-reduced-motion: reduce) {
    .heart, .burst-heart, .mini-burst { animation-duration: .01s !important; }
    * { transition-duration: .01s !important; }
  }
</style>
</head>
<body>

  <button id="themeToggle" title="Переключить тему">🌙</button>
  <div id="hearts"></div>

  <div class="container" id="card">
    <h1>Калькулятор совместимости</h1>
    <p class="subtitle">Введите два имени и узнайте свою судьбу 💗</p>

    <input id="name1" type="text" placeholder="Первое имя" autocomplete="off" autocapitalize="words">
    <input id="name2" type="text" placeholder="Второе имя" autocomplete="off" autocapitalize="words">
    <button id="calcBtn" class="main-btn">Рассчитать совместимость</button>

    <div id="result"></div>

    <div id="timer">
      <div class="timer-section">
        <h2>Мы вместе уже 💞</h2>
        <p class="since">с 30 августа 2026, 21:00</p>
        <div class="timer-grid">
          <div class="timer-cell"><span class="num" id="t-days">0</span><span class="unit">дней</span></div>
          <div class="timer-cell"><span class="num" id="t-hours">00</span><span class="unit">часов</span></div>
          <div class="timer-cell"><span class="num" id="t-mins">00</span><span class="unit">минут</span></div>
          <div class="timer-cell"><span class="num" id="t-secs">00</span><span class="unit">секунд</span></div>
        </div>
      </div>
      <div class="timer-section">
        <h2>До дня рождения Кати 🎂</h2>
        <p class="since">21 ноября · <span id="katya-age">…</span></p>
        <div class="timer-grid">
          <div class="timer-cell"><span class="num" id="k-days">0</span><span class="unit">дней</span></div>
          <div class="timer-cell"><span class="num" id="k-hours">00</span><span class="unit">часов</span></div>
          <div class="timer-cell"><span class="num" id="k-mins">00</span><span class="unit">минут</span></div>
          <div class="timer-cell"><span class="num" id="k-secs">00</span><span class="unit">секунд</span></div>
        </div>
      </div>
      <div class="timer-section">
        <h2>До дня рождения Матвея 🎂</h2>
        <p class="since">14 ноября · <span id="matvey-age">…</span></p>
        <div class="timer-grid">
          <div class="timer-cell"><span class="num" id="m-days">0</span><span class="unit">дней</span></div>
          <div class="timer-cell"><span class="num" id="m-hours">00</span><span class="unit">часов</span></div>
          <div class="timer-cell"><span class="num" id="m-mins">00</span><span class="unit">минут</span></div>
          <div class="timer-cell"><span class="num" id="m-secs">00</span><span class="unit">секунд</span></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ================= РАЗМЕРЫ ПОД УСТРОЙСТВО ================= */
const IS_MOBILE = window.matchMedia('(max-width: 600px)').matches;
const HEART_COUNT = IS_MOBILE ? 12 : 22;

/* ================= ТЕМА ================= */
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeToggle').textContent = '☀️';
  }
})();
document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
    document.getElementById('themeToggle').textContent = '🌙';
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
    document.getElementById('themeToggle').textContent = '☀️';
  }
});

/* ================= ФОНОВЫЕ СЕРДЕЧКИ (с лопанием) ================= */
const heartsWrap = document.getElementById('hearts');
const HEART_GLYPHS = ['♥', '💗', '💖', '💕', '❤'];

function spawnHeart(initial) {
  const h = document.createElement('span');
  h.className = 'heart';
  h.textContent = HEART_GLYPHS[Math.floor(Math.random() * HEART_GLYPHS.length)];
  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = (14 + Math.random() * 26) + 'px';
  h.style.animationDuration = (9 + Math.random() * 12) + 's';
  h.style.animationDelay = initial ? (-Math.random() * 20) + 's' : '0s';
  heartsWrap.appendChild(h);

  const onPop = (e) => {
    e.stopPropagation();
    e.preventDefault();
    popHeart(h);
  };
  h.addEventListener('click', onPop);
  h.addEventListener('touchstart', onPop, { passive: false });

  return h;
}

function popHeart(h) {
  if (h.dataset.popped) return;
  h.dataset.popped = '1';

  const rect = h.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  // Фиксируем позицию, чтобы сердечко не «прыгнуло» при смене анимации
  h.style.animation = 'none';
  h.style.position = 'fixed';
  h.style.left = rect.left + 'px';
  h.style.top = rect.top + 'px';
  h.style.bottom = 'auto';

  // принудительный reflow
  void h.offsetWidth;

  h.classList.add('popping');

  // Мини-брызги
  const burstCount = IS_MOBILE ? 4 : 6;
  const burstGlyphs = ['💗', '💕', '💖', '♥', '✨'];
  for (let i = 0; i < burstCount; i++) {
    const mini = document.createElement('span');
    mini.className = 'mini-burst';
    mini.textContent = burstGlyphs[Math.floor(Math.random() * burstGlyphs.length)];
    mini.style.left = cx + 'px';
    mini.style.top = cy + 'px';
    const angle = (Math.PI * 2 * i) / burstCount + Math.random() * .5;
    const dist = 30 + Math.random() * 45;
    mini.style.setProperty('--mx', (Math.cos(angle) * dist).toFixed(1) + 'px');
    mini.style.setProperty('--my', (Math.sin(angle) * dist).toFixed(1) + 'px');
    mini.style.fontSize = (10 + Math.random() * 8) + 'px';
    document.body.appendChild(mini);
    setTimeout(() => mini.remove(), 700);
  }

  // Убираем и спавним новое, чтобы фон не «худел»
  setTimeout(() => {
    h.remove();
    spawnHeart(false);
  }, 500);
}

(function makeHearts() {
  for (let i = 0; i < HEART_COUNT; i++) spawnHeart(true);
})();

/* ================= ДАННЫЕ ================= */
const KATYA_COMPLIMENT = 'Катя — это человек-солнце: рядом с ней становится теплее, светлее и как-то сразу верится, что всё обязательно будет хорошо. Такие люди, как она, — редкость ☀️💗';

const PAIRS = [
  [['катя', 'матвей'],    99.7],
  [['катя', 'аня'],       69],
  [['дима', 'дима'],      67],
  [['артем', 'тимофей'],  0.5],
  [['дима', 'аня'],       50],
  [['аня', 'тимофей'],    75, 'семья'],
  [['маша', 'артем'],     89],
  [['тимофей', 'катя'],   35, 'страшненькая подруга и изгой города'],
  [['кристина', 'саша'],  99],
  [['лера', 'саша'],      75],
  [['лера', 'влад'],      93],
  [['милана', 'леша'],    80],
  [['настя', 'замир'],    90],
  [['настя', 'игорь'],    75],
  [['вера', 'леша'],      79],
  [['буля', 'хуня'],      1000],
  [['тимофей2', 'егор'],  1000],
  [['ваня', 'маша'],      89],
  [['игнат', 'кристина'], 999, 'Шрек и Фиона'],
  [['игнат', 'фиона'],    999, 'Шрек и Фиона'],
  [['маша', 'костя'],     99.9, 'привет вам'],
  [['вика', 'чекушка'],   101,  'любовь на веки']
];

const HATE_PAIRS = [
  [['манюня', 'егор'],   -100],
  [['аня', 'юра'],       -1000],
  [['кристина', 'инна'], -95]
];

const ALIASES = {
  'екатерина': 'катя', 'катерина': 'катя', 'катюша': 'катя', 'катюха': 'катя', 'кет': 'катя',
  'матя': 'матвей', 'матюша': 'матвей',
  'дмитрий': 'дима', 'димон': 'дима', 'димыч': 'дима', 'димуля': 'дима',
  'тема': 'артем', 'темка': 'артем', 'темочка': 'артем', 'артемий': 'артем',
  'анюта': 'аня', 'анюша': 'аня', 'анна': 'аня', 'аннушка': 'аня',
  'тима': 'тимофей', 'тимоша': 'тимофей', 'тимоха': 'тимофей',
  'мария': 'маша', 'маруся': 'маша', 'машенька': 'маша',
  'крис': 'кристина', 'кристи': 'кристина', 'кристюша': 'кристина',
  'александр': 'саша', 'шура': 'саша', 'сашка': 'саша', 'сашок': 'саша', 'санек': 'саша',
  'валерия': 'лера', 'лерочка': 'лера', 'леруся': 'лера',
  'владислав': 'влад', 'влада': 'влад', 'владос': 'влад', 'владик': 'влад',

  'алексей': 'леша', 'леха': 'леша', 'лешка': 'леша', 'алеша': 'леша', 'лешенька': 'леша',
  'анастасия': 'настя', 'настюша': 'настя', 'настена': 'настя', 'настенька': 'настя',
  'верочка': 'вера', 'веруня': 'вера',
  'игорек': 'игорь', 'игореша': 'игорь',
  'егорка': 'егор', 'егорушка': 'егор',

  'алкашка': 'чекушка', 'винище': 'чекушка', 'бадяга': 'чекушка', 'самогон': 'чекушка', 'самогонка': 'чекушка', 'пиво': 'чекушка', 'пивас': 'чекушка', 'пивасик': 'чекушка', 'спиртное': 'чекушка', 'горящая вода': 'чекушка'
};

/* ================= ЛОГИКА ================= */
function norm(s) {
  const v = (s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
  return ALIASES[v] || v;
}

// Детерминированный хеш для пары имён — рандом стабилен, пока пара та же
function pairHash(a, b) {
  const key = [a, b].sort().join('|');
  let h = 2166136261;
  for (let i = 0; i < key.length; i++) {
    h ^= key.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

// Рандом от -15 до 80 включительно (96 значений)
function randomValueFor(a, b) {
  return -15 + (pairHash(a, b) % 96);
}

function getCompatibility(a, b) {
  for (const [[x, y], value, label] of PAIRS) {
    if ((a === x && b === y) || (a === y && b === x)) {
      return { value, label: label || null, isHate: false, isRandom: false };
    }
  }
  for (const [[x, y], value, label] of HATE_PAIRS) {
    if ((a === x && b === y) || (a === y && b === x)) {
      return { value, label: label || null, isHate: true, isRandom: false };
    }
  }
  const rnd = randomValueFor(a, b);
  return { value: rnd, label: null, isHate: rnd < 0, isRandom: true };
}

function formatPercent(v) {
  const s = Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.', ',');
  return s + '%';
}

function verdictFor(v) {
  if (v >= 1000) return 'МАКСИМАЛЬНАЯ СОВМЕСТИМОСТЬ! Это буквально судьба 🔥💫';
  if (v === 0)   return 'Увы, искры пока не видно… но всё впереди!';
  if (v < 1)     return 'Почти ничего, но вдруг это знак?';
  if (v < 10)    return 'Совсем чуть-чуть. Зато есть куда расти.';
  if (v < 25)    return 'Есть шанс, если сильно постараться.';
  if (v < 50)    return 'Маленькая искра уже теплится.';
  if (v < 60)    return 'Половина успеха — уже неплохо!';
  if (v < 70)    return 'Неплохо! Что-то определённо есть.';
  if (v < 80)    return 'Хорошая пара — вам точно не скучно.';
  if (v < 90)    return 'Отличная пара! 💕';
  if (v < 95)    return 'Очень сильная связь! 💖';
  if (v < 100)   return 'Почти идеал — берегите друг друга!';
  return 'Идеальная совместимость! 💞';
}

function verdictForHate(v) {
  const abs = Math.abs(v);
  if (abs >= 1000) return 'АБСОЛЮТНАЯ, ЛЕГЕНДАРНАЯ НЕНАВИСТЬ. Даже вселенная развела их по разным галактикам ☠️🖤💀';
  if (abs >= 100)  return 'МАКСИМАЛЬНАЯ НЕНАВИСТЬ. Им лучше никогда не пересекаться 🔥💀';
  if (abs >= 75)   return 'Жгучая неприязнь — воздух буквально искрит 💀';
  if (abs >= 50)   return 'Сильная антипатия. Не оставляйте их наедине.';
  if (abs >= 25)   return 'Заметная неприязнь — что-то тут явно не так.';
  return 'Лёгкая антипатия. Может, просто не тот день?';
}

function colorsForValue(v) {
  if (v < 0)     return { from: '#b91c3c', to: '#4a0011' };
  if (v >= 1000) return { from: '#ffd700', to: '#ff5c9d' };
  if (v === 0)   return { from: '#b9a7b3', to: '#9b8794' };
  if (v < 25)    return { from: '#d4a5b8', to: '#b58ba0' };
  if (v < 50)    return { from: '#ffa8cb', to: '#ff7eb0' };
  if (v < 80)    return { from: '#ff5c9d', to: '#e0417f' };
  if (v < 95)    return { from: '#ff3d8a', to: '#c72a6e' };
  return { from: '#ffb347', to: '#ff5c9d' };
}

/* ================= ТАЙМЕРЫ ================= */
const START_DATE    = new Date(2026, 7, 30, 21, 0, 0);
const KATYA_BIRTH   = { year: 2008, month: 11, day: 21 };
const MATVEY_BIRTH  = { year: 2008, month: 11, day: 14 };

function nextBirthday(month, day) {
  const now = new Date();
  let bd = new Date(now.getFullYear(), month - 1, day, 0, 0, 0);
  if (bd.getTime() < now.getTime()) bd = new Date(now.getFullYear() + 1, month - 1, day, 0, 0, 0);
  return bd;
}
function calcAge(birth) {
  const now = new Date();
  let a = now.getFullYear() - birth.year;
  const m = now.getMonth() + 1;
  if (m < birth.month || (m === birth.month && now.getDate() < birth.day)) a--;
  return a;
}
function splitDiff(diff) {
  if (diff < 0) diff = 0;
  const totalSec = Math.floor(diff / 1000);
  return {
    d: Math.floor(totalSec / 86400),
    h: Math.floor((totalSec % 86400) / 3600),
    m: Math.floor((totalSec % 3600) / 60),
    s: totalSec % 60
  };
}
function pad(n) { return String(n).padStart(2, '0'); }
function renderTimer(prefix, diff) {
  const t = splitDiff(diff);
  document.getElementById(prefix + '-days').textContent  = t.d;
  document.getElementById(prefix + '-hours').textContent = pad(t.h);
  document.getElementById(prefix + '-mins').textContent  = pad(t.m);
  document.getElementById(prefix + '-secs').textContent  = pad(t.s);
}
function updateAllTimers() {
  const now = Date.now();
  renderTimer('t', now - START_DATE.getTime());
  renderTimer('k', nextBirthday(KATYA_BIRTH.month, KATYA_BIRTH.day).getTime() - now);
  renderTimer('m', nextBirthday(MATVEY_BIRTH.month, MATVEY_BIRTH.day).getTime() - now);
  document.getElementById('katya-age').textContent  = 'исполнится ' + (calcAge(KATYA_BIRTH) + 1);
  document.getElementById('matvey-age').textContent = 'исполнится ' + (calcAge(MATVEY_BIRTH) + 1);
}
let timerInterval = null;
function startTimer() {
  updateAllTimers();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateAllTimers, 1000);
}

/* ================= ВЗРЫВ ПОСЛЕ РАСЧЁТА ================= */
function heartBurst(container, mode) {
  const isHate = mode === 'hate';
  const rect = container.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 3;
  const emojis = isHate
    ? ['💔', '🖤', '💀', '⚡', '🥀', '❌']
    : ['💗', '💖', '💕', '❤️', '💞', '💘'];
  const count = isHate ? (IS_MOBILE ? 16 : 26) : (IS_MOBILE ? 22 : 32);

  for (let i = 0; i < count; i++) {
    const h = document.createElement('span');
    h.className = 'burst-heart';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = cx + 'px';
    h.style.top  = cy + 'px';

    const angle = Math.random() * Math.PI * 2;
    const dist  = 80 + Math.random() * 240;
    h.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
    h.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
    h.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    h.style.fontSize = (14 + Math.random() * 22) + 'px';

    container.appendChild(h);
    setTimeout(() => h.remove(), 1400);
  }
}

/* ================= АНИМАЦИЯ ЧИСЛА ================= */
function animatePercent(el, target) {
  const duration = 1500;
  const start = performance.now();
  const isInt = Number.isInteger(target);

  function tick(now) {
    const p = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = target * eased;

    if (p >= 1) {
      el.textContent = formatPercent(target);
    } else {
      if (target === 0) el.textContent = '0%';
      else if (isInt)   el.textContent = Math.round(val) + '%';
      else              el.textContent = val.toFixed(1).replace('.', ',') + '%';
      requestAnimationFrame(tick);
    }
  }
  requestAnimationFrame(tick);
}

/* ================= КАРТИНКА-РЕЗУЛЬТАТ ================= */
let lastResult = null;
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function generateShareImage(a, b, percent, verdict, label, isHate) {
  const W = 900, H = 900;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bg = ctx.createLinearGradient(0, 0, W, H);
  if (isHate) { bg.addColorStop(0, '#2a0508'); bg.addColorStop(1, '#5a0f1e'); }
  else        { bg.addColorStop(0, '#ffe4ee'); bg.addColorStop(1, '#ffc9de'); }
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const heartGlyphs = isHate ? ['💔', '🖤', '💀'] : ['💗', '💖', '💕', '❤️'];
  for (let i = 0; i < 14; i++) {
    ctx.save();
    ctx.globalAlpha = 0.12 + Math.random() * 0.18;
    ctx.font = (30 + Math.random() * 60) + 'px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
    ctx.fillText(heartGlyphs[i % heartGlyphs.length], Math.random() * W * 0.9, Math.random() * H * 0.95);
    ctx.restore();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = isHate ? '#ff5b7f' : '#d6337c';
  ctx.font = 'bold 38px "Segoe UI", sans-serif';
  ctx.fillText('Калькулятор совместимости', W / 2, 100);

  let namesY = 240;
  if (label) {
    ctx.font = 'bold 22px "Segoe UI", sans-serif';
    const lw = ctx.measureText(label).width + 50;
    const lg = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    if (isHate) { lg.addColorStop(0, '#b91c3c'); lg.addColorStop(1, '#6b0018'); }
    else        { lg.addColorStop(0, '#ff9ec4'); lg.addColorStop(1, '#ff6fa8'); }
    ctx.fillStyle = lg;
    const rx = W / 2 - lw / 2, ry = 165, rh = 44, rr = 22;
    ctx.beginPath();
    ctx.moveTo(rx + rr, ry);
    ctx.lineTo(rx + lw - rr, ry);
    ctx.quadraticCurveTo(rx + lw, ry, rx + lw, ry + rr);
    ctx.lineTo(rx + lw, ry + rh - rr);
    ctx.quadraticCurveTo(rx + lw, ry + rh, rx + lw - rr, ry + rh);
    ctx.lineTo(rx + rr, ry + rh);
    ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - rr);
    ctx.lineTo(rx, ry + rr);
    ctx.quadraticCurveTo(rx, ry, rx + rr, ry);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(label, W / 2, ry + rh / 2 + 2);
    namesY = 265;
  }

  ctx.fillStyle = isHate ? '#ffd0e0' : '#7a3a56';
  let nameSize = 62;
  ctx.font = 'bold ' + nameSize + 'px "Segoe UI", sans-serif';
  const namesLine = capitalize(a) + '  +  ' + capitalize(b);
  while (ctx.measureText(namesLine).width > W - 100 && nameSize > 26) {
    nameSize -= 2;
    ctx.font = 'bold ' + nameSize + 'px "Segoe UI", sans-serif';
  }
  ctx.fillText(namesLine, W / 2, namesY);

  const cols = colorsForValue(percent);
  const pg = ctx.createLinearGradient(W / 2 - 220, 0, W / 2 + 220, 0);
  pg.addColorStop(0, cols.from);
  pg.addColorStop(1, cols.to);
  ctx.fillStyle = pg;
  ctx.font = 'bold 200px "Segoe UI", sans-serif';
  ctx.fillText(formatPercent(percent), W / 2, 480);

  ctx.fillStyle = isHate ? '#ffb0c2' : '#c9538a';
  ctx.font = '32px "Segoe UI", sans-serif';
  const words = verdict.split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    if ((line + ' ' + w).trim().length > 28 && line) { lines.push(line); line = w; }
    else { line = line ? line + ' ' + w : w; }
  }
  if (line) lines.push(line);
  const startY = 620 - (lines.length - 1) * 21;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, startY + i * 42));

  ctx.font = '100px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.fillText(isHate ? '💔' : '💗', W / 2, 810);

  return canvas;
}

async function shareResult() {
  if (!lastResult) return;
  const canvas = generateShareImage(
    lastResult.a, lastResult.b, lastResult.percent,
    lastResult.verdict, lastResult.label, lastResult.isHate
  );
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], 'compatibility.png', { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Калькулятор совместимости' }); return; }
      catch (e) {}
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'compatibility.png';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

/* ================= ОСНОВНАЯ ФУНКЦИЯ ================= */
const resultBox = document.getElementById('result');
const timerBox  = document.getElementById('timer');
const card      = document.getElementById('card');

function calculate() {
  const rawA = document.getElementById('name1').value.trim();
  const rawB = document.getElementById('name2').value.trim();
  const n1 = norm(rawA);
  const n2 = norm(rawB);

  if (!n1 || !n2) {
    resultBox.innerHTML = '<p class="verdict">Введите оба имени, пожалуйста 🙏</p>';
    timerBox.classList.remove('show');
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    return;
  }

  const { value, label, isHate } = getCompatibility(n1, n2);
  const verdict = isHate ? verdictForHate(value) : verdictFor(value);
  const cols    = colorsForValue(value);
  lastResult = { a: rawA || n1, b: rawB || n2, percent: value, verdict, label, isHate };

  const isKatyaMatvey =
    (n1 === 'катя' && n2 === 'матвей') ||
    (n1 === 'матвей' && n2 === 'катя');

  const barWidth = Math.min(Math.abs(value), 100);

  if (isHate) {
    resultBox.innerHTML = `
      <div class="hate-block">
        <div class="hate-title">💔 Блок ненависти 💔</div>
        ${label ? `<div class="label-badge hate-badge">${label}</div>` : ''}
        <div class="percent-label">Уровень вражды</div>
        <div class="percent" id="percentEl" style="background: linear-gradient(135deg, ${cols.from}, ${cols.to}); -webkit-background-clip: text; background-clip: text;">0%</div>
        <div class="bar"><div class="bar-fill" id="barFill" style="background: linear-gradient(90deg, ${cols.from}, ${cols.to});"></div></div>
        <p class="verdict">${verdict}</p>
      </div>
      <button class="share-btn" id="shareBtn">📸 Поделиться результатом</button>
    `;
    heartBurst(card, 'hate');
  } else {
    resultBox.innerHTML = `
      ${label ? `<div class="label-badge">${label}</div>` : ''}
      <div class="percent-label">Совместимость</div>
      <div class="percent" id="percentEl" style="background: linear-gradient(135deg, ${cols.from}, ${cols.to}); -webkit-background-clip: text; background-clip: text;">0%</div>
      <div class="bar"><div class="bar-fill" id="barFill" style="background: linear-gradient(90deg, ${cols.from}, ${cols.to});"></div></div>
      <p class="verdict">${verdict}</p>
      ${isKatyaMatvey ? `
        <div class="compliment-box">
          <span class="heart-top">💌</span>
          <span class="tag">Специально для Кати</span>
          ${KATYA_COMPLIMENT}
        </div>
      ` : ''}
      <button class="share-btn" id="shareBtn">📸 Поделиться результатом</button>
    `;
    heartBurst(card, 'love');
  }

  animatePercent(document.getElementById('percentEl'), value);

  requestAnimationFrame(() => {
    const fill = document.getElementById('barFill');
    if (fill) setTimeout(() => { fill.style.width = barWidth + '%'; }, 50);
  });

  document.getElementById('shareBtn').onclick = shareResult;

  if (isKatyaMatvey) {
    timerBox.classList.add('show');
    startTimer();
  } else {
    timerBox.classList.remove('show');
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }
}

document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('name1').addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
document.getElementById('name2').addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
